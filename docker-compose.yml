services:
  # ─── MongoDB ───
  mongo:
    image: mongo:7
    container_name: pulseboard-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: pulseboard

  # ─── Express API Server ───
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pulseboard-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/pulseboard
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}

  # ─── React Client (nginx) ───
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: pulseboard-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  mongo-data:
